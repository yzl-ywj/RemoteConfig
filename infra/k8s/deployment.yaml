# ═════════════════════════════════════════════════════
# IoT Remote Config — Kubernetes Deployment
# Target: AKS (Azure Kubernetes Service)
# ═════════════════════════════════════════════════════

---
apiVersion: v1
kind: Namespace
metadata:
  name: iot-remote-config
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: iot-remote-config-sa
  namespace: iot-remote-config
  labels:
    app: iot-remote-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: iot-remote-config-config
  namespace: iot-remote-config
data:
  ASPNETCORE_ENVIRONMENT: "${ENVIRONMENT}"
  ASPNETCORE_URLS: "http://+:8080"
  RemoteConfig__MaxConfigSizeBytes: "65536"
  RemoteConfig__MaxVersionsPerDevice: "50"
  RemoteConfig__DefaultCommandTimeoutSeconds: "30"
  RemoteConfig__PerDeviceRateLimit: "10"
  RemoteConfig__PerTenantRateLimit: "100"
  RemoteConfig__DispatchMode: "ServiceBus"
---
apiVersion: v1
kind: Secret
metadata:
  name: iot-remote-config-secrets
  namespace: iot-remote-config
type: Opaque
stringData:
  # These are placeholders — use Azure Key Vault CSI driver in production
  ApplicationInsights__ConnectionString: "InstrumentationKey=${APPINSIGHTS_KEY}"
  Database__ConnectionString: "Server=tcp:${SQL_SERVER}.database.windows.net,1433;Initial Catalog=${SQL_DATABASE};Encrypt=True;TrustServerCertificate=False;Authentication=Active Directory Managed Identity;"
  Redis__ConnectionString: "${REDIS_HOSTNAME}:6380,password=${REDIS_PASSWORD},ssl=True,abortConnect=False"
  ServiceBus__ConnectionString: "Endpoint=sb://${SERVICEBUS_NAMESPACE}.servicebus.windows.net/;Authentication=ManagedIdentity;"
  IoTHub__ConnectionString: "HostName=${IOTHUB_NAME}.azure-devices.net;Authentication=ManagedIdentity;"
  AzureAd__TenantId: "${AZURE_TENANT_ID}"
  AzureAd__ClientId: "${AZURE_AD_APP_ID}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iot-remote-config
  namespace: iot-remote-config
  labels:
    app: iot-remote-config
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: iot-remote-config
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: iot-remote-config
        version: v1
    spec:
      serviceAccountName: iot-remote-config-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iot-remote-config
          image: ${ACR_NAME}.azurecr.io/iot-remote-config:${IMAGE_TAG}
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: iot-remote-config-config
            - secretRef:
                name: iot-remote-config-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: iot-remote-config-svc
  namespace: iot-remote-config
  labels:
    app: iot-remote-config
spec:
  type: ClusterIP
  selector:
    app: iot-remote-config
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iot-remote-config-ingress
  namespace: iot-remote-config
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api-rc.iot.${DOMAIN}
      secretName: iot-remote-config-tls
  rules:
    - host: api-rc.iot.${DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: iot-remote-config-svc
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: iot-remote-config-hpa
  namespace: iot-remote-config
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: iot-remote-config
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
